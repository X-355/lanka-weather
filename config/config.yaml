# Sri Lanka Weather Lab — single source of configuration.
# Coordinates are town centres; elevation in metres (approximate).
# zone: Sri Lanka climatic zone (wet / intermediate / dry).

towns:
  colombo:      {name: Colombo,      lat: 6.9271, lon: 79.8612, elevation: 5,    zone: wet,          region: Western}
  kandy:        {name: Kandy,        lat: 7.2906, lon: 80.6337, elevation: 500,  zone: intermediate, region: Central}
  galle:        {name: Galle,        lat: 6.0535, lon: 80.2210, elevation: 10,   zone: wet,          region: Southern}
  jaffna:       {name: Jaffna,       lat: 9.6615, lon: 80.0255, elevation: 5,    zone: dry,          region: Northern}
  trincomalee:  {name: Trincomalee,  lat: 8.5874, lon: 81.2152, elevation: 10,   zone: dry,          region: Eastern}
  batticaloa:   {name: Batticaloa,   lat: 7.7310, lon: 81.6747, elevation: 5,    zone: dry,          region: Eastern}
  anuradhapura: {name: Anuradhapura, lat: 8.3114, lon: 80.4037, elevation: 80,   zone: dry,          region: North Central}
  nuwara_eliya: {name: Nuwara Eliya, lat: 6.9497, lon: 80.7891, elevation: 1890, zone: wet,          region: Central}
  ratnapura:    {name: Ratnapura,    lat: 6.6828, lon: 80.3992, elevation: 35,   zone: wet,          region: Sabaragamuwa}
  hambantota:   {name: Hambantota,   lat: 6.1241, lon: 81.1185, elevation: 15,   zone: dry,          region: Southern}

timezone: Asia/Colombo

data:
  start_date: "2000-01-01"
  # ERA5 (not "best_match") so the whole record comes from one consistent reanalysis.
  archive_model: era5
  # ERA5 is published with a ~5 day delay; we never use days newer than this.
  archive_delay_days: 6
  # Budget of Open-Meteo "API call weight" a single fetch run may spend.
  # The free tier allows ~5,000/hour and ~10,000/day; a bootstrap that runs out resumes next run.
  max_weight_per_run: 4000

target:
  rain_mm: 1.0      # "rain day" = daily precipitation >= 1.0 mm (WMO convention)
  heavy_mm: 50.0    # "heavy rain day" for the research-only risk tracker

split:
  # Chronological split — no shuffling. The test years are never seen in training or tuning.
  train_end: "2018-12-31"
  valid_end: "2021-12-31"   # validation: early stopping only
  # test: everything from 2022-01-01 to the latest archived day

nwp:
  # Archived day-ahead forecasts (Open-Meteo Previous Runs API, available from Jan 2024).
  start_date: "2024-01-01"
  models:
    ecmwf_ifs025: "ECMWF IFS 0.25°"
    gfs_seamless: "NCEP GFS"
    icon_seamless: "DWD ICON"

solar:
  performance_ratio: 0.78     # inverter, wiring, soiling, temperature losses (typical rooftop 0.75–0.80)
  default_tariff_lkr: 37.0    # LKR per kWh avoided — user-editable on the site
  default_cost_lkr_per_kwp: 280000

lightgbm:
  objective: binary
  learning_rate: 0.03
  num_leaves: 31
  min_data_in_leaf: 80
  feature_fraction: 0.8
  bagging_fraction: 0.8
  bagging_freq: 1
  lambda_l2: 1.0
  num_boost_round: 3000
  early_stopping_rounds: 150
  seed: 42
  verbose: -1
