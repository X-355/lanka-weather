name: NASA IMERG rainfall
# Downloads NASA GPM IMERG daily rain at the district points (independent truth for scoring).
# Daily: picks up the last few days and upgrades early/late values to the gauge-calibrated final version.
# Manual run with a bigger budget backfills the archive (2022 onward).
on:
  schedule:
    - cron: "10 6 * * *"     # 11:40 Sri Lanka time; away from the nightly forecast window
  workflow_dispatch:
    inputs:
      budget: { description: "Max requests to NASA (≈0.85 s each)", default: "300" }
permissions:
  contents: write
concurrency:
  group: data-writes
  cancel-in-progress: false
jobs:
  imerg:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -q -r requirements.txt
      - name: Fetch IMERG
        env:
          EARTHDATA_TOKEN: ${{ secrets.EARTHDATA_TOKEN }}
        run: python -m lankaweather imerg --budget ${{ github.event.inputs.budget || '300' }}
      - name: Commit
        run: |
          git config user.name "lanka-weather-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/raw/imerg
          git diff --cached --quiet && exit 0
          git commit -m "imerg: NASA rainfall $(date -u +%F)"
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 10; done
