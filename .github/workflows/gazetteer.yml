name: Refresh place finder (GN divisions + OpenStreetMap)

on:
  schedule:
    - cron: "41 3 3 * *"   # 3rd of each month, 09:11 Sri Lanka time
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: data-writes
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - run: python -m lankaweather gazetteer
      - name: Commit
        run: |
          git config user.name "lanka-weather-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config/osm_places.csv config/gn_divisions.csv site/data/gazetteer.json
          git diff --cached --quiet && exit 0
          git commit -m "gazetteer: GN divisions + OpenStreetMap places $(date -u +%F)"
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 10; done

  pages:
    needs: refresh
    uses: ./.github/workflows/pages.yml
    permissions:
      contents: read
      pages: write
      id-token: write
