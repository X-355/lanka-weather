name: Deploy site

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["site/**", "lankaweather/snapshots.py", "config/rivers.json"]
  # Refresh the shared live data (sky forecast grid, rivers, reservoirs) every 3 hours.
  # Times avoid the nightly forecast window (17:00–18:30 UTC), which needs the API quota.
  schedule:
    - cron: "40 1-22/3 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Build and deploy are separate jobs: deploying in the same job as the upload sometimes races
  # GitHub's artifact store ("No artifacts named github-pages were found").
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }   # pick up the commit the calling workflow just pushed
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Fetch shared live data (never fails the build; the site falls back to live calls)
        run: |
          pip install -q requests pyyaml
          python -m lankaweather snapshots || true
          ls -la site/data/live || true
      - name: Stamp asset URLs with this commit (so browsers never mix old and new code)
        run: sed -i "s/?v=dev/?v=${GITHUB_SHA::8}/g" site/index.html site/assets/*.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
