name: Daily forecast

# 17:35 UTC = 23:05 Sri Lanka time, so "today" is almost complete when the forecast for tomorrow is issued.
# GitHub may start scheduled jobs late at busy times, so there is a backup schedule. A run that starts outside
# 18:00–23:59 local time still updates data and the site but does not issue a forecast.

on:
  schedule:
    - cron: "35 17 * * *"   # 23:05 Sri Lanka time
    - cron: "52 17 * * *"   # backup 23:22, in case GitHub skips or delays the first; the ledger keeps the first forecast
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: data-writes
  cancel-in-progress: false

jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      has_model: ${{ steps.m.outputs.has_model }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt

      - name: Fetch, score matured forecasts, predict tomorrow, build site data
        run: python -m lankaweather daily --skip-power

      - id: m
        run: echo "has_model=$([ -f models/metadata.json ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Commit
        run: |
          git config user.name "lanka-weather-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data predictions site/data
          git diff --cached --quiet && exit 0
          git commit -m "daily: forecast $(TZ=Asia/Colombo date +%F)"
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 10; done

  pages:
    needs: forecast
    if: needs.forecast.outputs.has_model == 'true'
    uses: ./.github/workflows/pages.yml
    permissions:
      contents: read
      pages: write
      id-token: write
